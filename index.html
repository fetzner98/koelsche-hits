<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C8102E">
<meta name="robots" content="noindex, nofollow">
<title>Kölsche Hitster</title>
<style>
:root { --rot:#C8102E; --rot-dunkel:#8E0B20; --wiess:#FFF8F6; --tinte:#2A0A10; --leise:#7A4A52; --linie:#F0D5D9; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --wiess:#1A0709; --tinte:#FBEAEC; --leise:#C79AA1; --linie:#3A1419; --rot-dunkel:#E84A62; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--wiess); color: var(--tinte); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
header { background: var(--rot); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
  background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.12) 22px 44px); }
header h1 { font: 800 1.45rem/1 "Arial Black", system-ui, sans-serif; margin: 0; }
main { flex: 1; display: grid; place-items: center; padding: 24px max(18px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
h2 { margin: 0; font: 800 1.5rem/1.2 "Arial Black", system-ui, sans-serif; }
input[type=password] { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--linie); background: transparent; color: var(--tinte); font-size: 1.1rem; }
label.merk { display: flex; gap: 10px; align-items: center; color: var(--leise); }
button { border: 0; border-radius: 18px; padding: 18px; font: 800 1.15rem system-ui, sans-serif; background: var(--rot); color: #fff; box-shadow: 0 4px 0 var(--rot-dunkel); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rot-dunkel); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--rot-dunkel); outline-offset: 3px; }
#msg { color: var(--rot-dunkel); font-weight: 600; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<header><h1>Kölsche Hitster</h1></header>
<main>
  <form id="f" hidden>
    <h2>Passwort</h2>
    <input type="password" id="pw" autocomplete="current-password" aria-label="Passwort" autofocus>
    <label class="merk"><input type="checkbox" id="merk" checked> Auf diesem Gerät merken</label>
    <button type="submit">Öffnen</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u(S), iterations: N, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

}
const get = () => { try { return localStorage.getItem("kh_pw"); } catch { return null; } };
const put = v => { try { v ? localStorage.setItem("kh_pw", v) : localStorage.removeItem("kh_pw"); } catch {} };
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  document.getElementById("msg").textContent = "";
  try { if (document.getElementById("merk").checked) put(pw); await unlock(pw); }
  catch { put(null); document.getElementById("msg").textContent = "Falsches Passwort."; }
};
(async () => {
  const saved = get();
  if (saved) { try { await unlock(saved); return; } catch { put(null); } }
  document.getElementById("f").hidden = false;
})();
